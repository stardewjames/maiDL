name: Build mobile apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  android:
    name: Android APK and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze
      - name: Test Flutter
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
      - name: Test native Android downloader
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Upload Android APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maidl-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maidl-android-tests-${{ github.run_number }}
          path: |
            build/app/reports/tests/testDebugUnitTest/
            build/app/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS unsigned app and share extension
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Smoke test native iOS video compatibility
        run: bash tool/verify_ios_video.sh
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify embedded extension and matching versions
        shell: bash
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          extension="$app/PlugIns/ShareExtension.appex"
          test -d "$extension"
          for key in CFBundleShortVersionString CFBundleVersion; do
            app_value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")
            extension_value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$extension/Info.plist")
            test "$app_value" = "$extension_value"
          done
      - name: Package unsigned app
        run: |
          mkdir -p build/ci
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ci/maidl-ios-unsigned.zip
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maidl-ios-unsigned-${{ github.run_number }}
          path: build/ci/maidl-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
